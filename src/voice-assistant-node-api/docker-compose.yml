# Docker Compose Configuration for Voice Assistant Node API
# Run with: docker-compose up
# This file is for development purposes

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: voice-assistant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voice_assistant
    ports:
      - '5434:5432'
    volumes:
      # Persist database data between container restarts
      - voice_assistant_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voice-assistant

  # Node.js API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-assistant-node-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://postgres:postgres@db:5432/voice_assistant
      
      # Vapi Configuration - UPDATE WITH YOUR CREDENTIALS
      VAPI_API_KEY: vapi_api_key_placeholder
      VAPI_SECRET_TOKEN: vapi_secret_token_placeholder
      VAPI_PHONE_NUMBER_ID: vapi_phone_number_id_placeholder
      
      # Twilio Configuration (Optional)
      TWILIO_ACCOUNT_SID: twilio_account_sid_placeholder
      TWILIO_AUTH_TOKEN: twilio_auth_token_placeholder
      TWILIO_PHONE_NUMBER: '+1 (Unknown Twilio Number)'
      
      # Server Configuration
      HOST: 0.0.0.0
      PORT: 8000
      NODE_ENV: development
    
    ports:
      - '8000:8000'
    
    volumes:
      # Mount source code for development hot-reload
      - .:/app
      - /app/node_modules # Don't overwrite node_modules from container
      - /app/dist # Don't overwrite compiled dist from container
    
    networks:
      - voice-assistant
    
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  # Named volume for persistent database storage
  voice_assistant_db_data:

networks:
  # Custom bridge network for service-to-service communication
  voice-assistant:
    driver: bridge
